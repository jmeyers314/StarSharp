# FWHM-sensitivity weights as computed by ts_ofc / mtaos -- SNAPSHOT.
#
# Provided so StarSharp can reproduce mtaos results exactly, via
# default_normalizations(source='ts_ofc').  The StarSharp default
# (fwhm.yaml) is measured by raytracing instead and is the more accurate
# number; see bootstrap/make_fwhm_weights.py.  The two agree to ~12% in
# the median, with focus-like DOF agreeing to ~0.5%.
#
# Units: arcsec per um (translations, bending modes) or arcsec per degree
# (rotations), matching fwhm.yaml.
#
# PROVENANCE -- generated by ts_ofc's
# python/lsst/ts/ofc/scripts/generate_normalization_weights.py with
#   --method quadrature --rings 5 --spokes 6 --field-radius 1.75
# on branch tickets/DM-54667 (commit 84d53bf), which at time of writing is
# NOT merged to ts_ofc main.  Underlying sensitivity is ts_ofc's
# policy/sensitivity_matrix/lsst_sensitivity_dz_31_29_50.yaml, converted to
# PSF width by lsst.ts.wep.utils.convertZernikesToPsfWidth.
#
# Verified: range.yaml**0.5 * (these)**-0.5 reproduces mtaos v13's
# ts_config_mttcs MTAOS/ofc/normalization_weights/range0.5_fwhm-0.15.yaml
# to 1.2e-14 max relative.  NOTE that file's name is a typo: it really uses
# beta = -0.5, not -0.15 (its own header says so, and the commit that added
# it -- ts_config_mttcs 92575b1 -- is titled 'range0.5_fwhm-0.5').

